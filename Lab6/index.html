<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Web Development Quiz</title>
            <link rel="stylesheet" href="style.css">
        </head>
        
        <body>

            <header>
                <h1>Web Development Quiz</h1>
                <p>Test your knowledge of HTML, CSS and JavaScript</p>
            </header>

            <main class="quiz-container">

                <section id="quiz-section">

                    <div class="quiz-top">
                        <p id="question-number">Question 1 of 10</p>
                        <p class="timer">
                            Time left: <span id="time">15</span>s
                        </p>
                    </div>

                    <div class="progress-track">
                        <div id="progress-bar"></div>
                    </div>

                    <h2 id="question">Question will appear here</h2>

                    <div id="answer-options" class="answer-options">
                    </div>

                    <p id="feedback"></p>

                    <div class="button-area">
                        <button id="submit-btn" type="button">
                            Submit Answer
                        </button>

                        <button id="next-btn" type="button" disabled>
                            Next Question
                        </button>
                    </div>

                </section>

                <section id="result-section" class="hidden">

                    <h2>Quiz Completed!</h2>

                    <p id="final-score"></p>

                    <p id="result-message"></p>

                    <button id="restart-btn" type="button">
                        Restart Quiz
                    </button>

                </section>

            </main>

            <footer>
                <p>Good luck and have fun learning!</p>
            </footer>

            <script src="script.js"></script>

        </body>
    </html>
</DOCTYPE>
